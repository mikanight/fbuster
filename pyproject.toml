[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = "fedorabooster"
version = "6.0.0-dev"
description = "Утилита настройки и обслуживания Fedora Linux"
readme = "README.md"
license = "MIT"
authors = [{ name = "PLAFON" }]
requires-python = ">=3.11"

[project.urls]
Homepage   = "https://github.com/mikanight/fbuster"
Repository = "https://github.com/mikanight/fbuster"
Issues     = "https://github.com/mikanight/fbuster/issues"

[project.scripts]
fedorabooster = "altbooster:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["altbooster"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "ui*", "tabs*", "modules*"]

[tool.setuptools.package-data]
"modules" = ["*.json"]
"ui" = ["*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I",    # pycodestyle + pyflakes + isort
    "B",                     # flake8-bugbear
    "UP",                    # pyupgrade (modern Python syntax)
    "C4",                    # flake8-comprehensions
]
ignore = ["E501", "E701"]

[tool.ruff.lint.per-file-ignores]
"src/tabs/apps.py" = ["E501"]
"src/core/backend.py" = ["F401"]
