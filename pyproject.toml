[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = "fedorabooster"
version = "6.0.0"
description = "Утилита настройки и обслуживания Fedora Linux"
readme = "README.md"
license = "MIT"
authors = [{ name = "PLAFON" }]
requires-python = ">=3.11"

[project.urls]
Homepage   = "https://github.com/mikanight/fedorabooster"
Repository = "https://github.com/mikanight/fedorabooster"
Issues     = "https://github.com/mikanight/fedorabooster/issues"

[project.scripts]
fedorabooster = "altbooster:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["altbooster"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "ui*", "tabs*", "modules*"]

[tool.setuptools.package-data]
"modules" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle + pyflakes + isort
ignore = ["E501", "E402", "E701"]                # длинные строки в bash-командах — допустимо

[tool.ruff.lint.per-file-ignores]
"src/tabs/apps.py" = ["E501"]
